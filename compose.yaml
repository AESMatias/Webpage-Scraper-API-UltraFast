services:
  scraper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraper-api
    restart: unless-stopped
    init: true
    shm_size: '1gb'
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - MAX_CONCURRENT_SCRAPES=5
      - TIMEOUT_MS=20000
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
